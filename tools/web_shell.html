<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>island-simulator</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #102a31; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas {
      display: block;
      width: min(100vw, 177.777778vh);
      height: min(100vh, 56.25vw);
      background: #152a32;
      outline: none;
    }
    #instructions {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: min(90vw, 680px);
      padding: 10px 14px;
      border: 1px solid rgba(158, 235, 207, 0.55);
      border-radius: 8px;
      background: rgba(4, 20, 22, 0.86);
      color: #e8f6ee;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
    #instructions strong { color: #79eec3; }
    #status { display: block; margin-top: 4px; color: #b8ccc5; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="instructions">
    <strong>Click the island to look around</strong> · WASD / arrows move · Shift toggles walk/run on ground · Tab flight (Space up, Shift down) · B camera motion · F11 fullscreen · F1 diagnostics · F2 world view · M mute · Escape releases the mouse
    <span id="status">Loading island-simulator…</span>
  </div>
  <script>
    const canvas = document.getElementById("canvas");
    const instructions = document.getElementById("instructions");
    const status = document.getElementById("status");
    globalThis.islandDeploymentOutput = "";
    const record = (writer, values) => {
      const line = values.join(" ");
      globalThis.islandDeploymentOutput += line + "\n";
      writer(...values);
    };
    var Module = {
      canvas,
      print: (...values) => record(console.log, values),
      printErr: (...values) => record(console.error, values),
      onRuntimeInitialized: () => { status.textContent = "Ready"; },
      onAbort: reason => { status.textContent = `Unable to start: ${reason}`; }
    };
    canvas.addEventListener("mousedown", event => {
      canvas.focus();
      if (event.button === 0 && document.pointerLockElement !== canvas) {
        // Raw, unaccelerated motion where the browser offers it; the plain lock is the fallback.
        const lock = canvas.requestPointerLock({ unadjustedMovement: true });
        if (lock && typeof lock.catch === "function") {
          lock.catch(() => canvas.requestPointerLock());
        }
      }
    });
    document.addEventListener("pointerlockchange", () => {
      instructions.style.opacity = document.pointerLockElement === canvas ? "0" : "1";
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
